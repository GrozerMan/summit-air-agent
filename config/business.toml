# Summit Air business rules. Anything the owner might want to change lives here
# rather than in code or in the prompt.

[company]
name = "Summit Air"
timezone = "America/New_York"

# When the office is staffed. The agent answers around the clock regardless.
[hours]
mon = ["07:00", "19:00"]
tue = ["07:00", "19:00"]
wed = ["07:00", "19:00"]
thu = ["07:00", "19:00"]
fri = ["07:00", "19:00"]
sat = ["08:00", "14:00"]
sun = []

[pricing]
diagnostic = 129
diagnostic_member = 0
tune_up = 159
after_hours_surcharge = 99
replacement_estimate = 0

[membership]
name = "Summit Comfort Club"
benefits = ["no diagnostic fee", "two tune-ups a year", "priority scheduling"]

[service_area]
# Counties as GeoNames and the USPS name them. Every ZIP in them is in
# config/service_area.csv (scripts/build_service_area.py), so a real customer is
# never turned away because a curated list missed their town.
counties = ["Nassau", "Suffolk", "Westchester", "Kings", "Queens", "Bronx", "New York", "Richmond"]

# How a county is said out loud. Anything not listed is "<name> County".
[service_area.names]
Kings = "Brooklyn"
Queens = "Queens"
Bronx = "the Bronx"
"New York" = "Manhattan"
Richmond = "Staten Island"

# Places callers say that aren't a ZIP's postal name: boroughs, neighborhoods,
# hamlets that share a ZIP. A name that turns up in two counties (Inwood, Floral
# Park) is ambiguous, and the agent asks for the ZIP.
[service_area.aliases]
"Nassau County" = "Nassau"
"Suffolk County" = "Suffolk"
