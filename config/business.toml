# Read out in the gas-leak safety script. Numbers are from each utility's own
# "smell gas" page (checked 7 Nov 2026); re-check them before relying on this in
# production. Queens is deliberately missing: it's split between National Grid,
# Con Edison and (the Rockaways) National Grid Long Island, so a Queens caller
# hears "nine-one-one or your gas company" rather than a number that may be wrong.
# Northern Westchester is partly NYSEG / Central Hudson: owner to confirm.
[gas_utilities.Nassau]
name = "National Grid"
phone = "1-800-490-0045"

[gas_utilities.Suffolk]
name = "National Grid"
phone = "1-800-490-0045"

[gas_utilities.Westchester]
name = "Con Edison"
phone = "1-800-752-6633"

[gas_utilities.Kings]
name = "National Grid"
phone = "718-643-4050"

[gas_utilities.Richmond]
name = "National Grid"
phone = "718-643-4050"

[gas_utilities.Bronx]
name = "Con Edison"
phone = "1-800-752-6633"

[gas_utilities."New York"]
name = "Con Edison"
phone = "1-800-752-6633"

[triage]
no_heat_max_indoor_f = 58
no_cooling_min_indoor_f = 85
p1_within_hours = 24
p2_within_hours = 72

[scheduling]
windows = ["08:00-10:00", "10:00-12:00", "12:00-14:00", "14:00-16:00", "16:00-18:00"]
jobs_per_window_per_county = 2
emergency_reserve_per_day_per_county = 2
member_priority_per_day_per_county = 2
horizon_days = 14
options_to_offer = 3
# A window has to start at least this far out for a tech to get there.
lead_minutes = 60
# Seeds the fake "already booked" load so demos and tests see the same calendar.
simulated_load_seed = 42

[escalation]
# Empty means no live transfers; requests become callbacks. HUMAN_TRANSFER_NUMBER overrides.
human_transfer_number = ""
urgent_callback_minutes = 30
callback_hours = 2

[silence]
check_in_seconds = 12
max_check_ins = 2
